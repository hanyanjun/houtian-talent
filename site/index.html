<head>

<title>后天特性 · 全词条｜我要当老祖</title>
<style>
:root{
  --bg:#10141F; --panel:#1A2030; --panel-2:#202739; --line:rgba(217,180,91,.22);
  --gold:#D9B45B; --gold-2:#F0D28A; --txt:#E8E4D8; --txt-2:#8E97A8; --txt-3:#B9C0CE;
  --fan:#8E97A8; --liang:#58C4A6; --you:#E4B54E;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(ellipse 80% 24% at 50% 0,rgba(217,180,91,.08),transparent 70%),var(--bg);
  color:var(--txt); font-size:14px; line-height:1.5;
  padding-bottom:calc(72px + var(--safe-b));
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.page{max-width:520px;margin:0 auto;padding:0 16px}

/* ── hero（随页面滑走，尽量矮） ── */
.hero{padding:calc(18px + env(safe-area-inset-top,0px)) 0 10px;text-align:center}
.kicker{font-size:12px;color:var(--txt-2);letter-spacing:.4em;text-indent:.4em}
.hero h1{font-size:26px;font-weight:800;letter-spacing:.1em;margin-top:2px;
  background:linear-gradient(180deg,#F5E3B0,#D9B45B);-webkit-background-clip:text;background-clip:text;color:transparent}
.ver{margin-top:4px;font-size:12px;color:var(--txt-2);font-variant-numeric:tabular-nums}
.stat-bar{display:flex;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(26,32,48,.7)}
.stat{flex:1;padding:6px 4px;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:6px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--txt-2)}
.stat.t b{color:var(--gold-2)} .stat.f b{color:var(--fan)} .stat.l b{color:var(--liang)} .stat.y b{color:var(--you)}

/* ── 吸顶：搜索栏 + 属性标签（下滑隐藏、上滑出现） ── */
.sticky{position:sticky;top:0;z-index:20;margin:0 -16px;padding:8px 16px 8px;
  background:linear-gradient(var(--bg) 92%,rgba(16,20,31,0));border-bottom:1px solid transparent}
.bar{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font-size:16px;padding:0 34px 0 34px;outline:none;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{display:none;-webkit-appearance:none}
.search input::placeholder{color:var(--txt-2);font-size:14px}
.search input:focus{border-color:rgba(217,180,91,.6);box-shadow:0 0 0 3px rgba(217,180,91,.12)}
.search svg{position:absolute;left:10px;top:11px;width:18px;height:18px;stroke:var(--txt-2);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search .clr{position:absolute;right:2px;top:2px;width:36px;height:36px;border:0;background:none;color:var(--txt-2);font-size:20px;display:none}
.search.has .clr{display:block}
.ibtn{position:relative;flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;color:var(--txt-2)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.on{color:var(--gold-2);border-color:rgba(217,180,91,.6);background:linear-gradient(180deg,#2A3145,#232A3E)}
.ibtn .cnt{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;padding:0 4px;background:var(--gold);color:#1a1405;
  font-size:12px;font-weight:700;line-height:18px;text-align:center;display:none}
.ibtn .cnt.show{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
  color:var(--txt-3);font-size:13px;white-space:nowrap}
.chip.on{color:var(--gold-2);border-color:rgba(217,180,91,.6);background:linear-gradient(180deg,#2A3145,#232A3E)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px;font-size:12px}
.gchips{margin-top:6px}
.gchips .chip{height:28px;padding:0 11px;border-radius:8px;font-size:13px;background:rgba(26,32,48,.6);color:var(--txt-2)}
.gchips .chip.on{color:var(--gold-2);border-color:rgba(217,180,91,.6);background:rgba(217,180,91,.12)}
.panel{display:none;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(26,32,48,.96)}
.panel.show{display:block}
.panel h4{font-size:12px;font-weight:600;color:var(--txt-2);letter-spacing:.15em;margin-bottom:8px}
.panel .chips{margin:0;padding:0;flex-wrap:wrap;overflow:visible}
.chip.q-f.on{color:var(--fan);border-color:rgba(142,151,168,.6)}
.chip.q-l.on{color:var(--liang);border-color:rgba(88,196,166,.6)}
.chip.q-y.on{color:var(--you);border-color:rgba(228,181,78,.6)}

/* ── 内容 ── */
.tip{display:flex;align-items:center;gap:10px;margin:8px 0 0;font-size:13px;color:var(--txt-2)}
.tip b{color:var(--gold-2)}
.lnk{border:0;background:none;color:var(--gold);font-size:13px;padding:6px 0 6px 8px;margin-left:auto}
.sec{margin-top:14px}
.sec-head{display:flex;align-items:center;gap:10px}
.no{font-size:12px;color:var(--gold);letter-spacing:.15em;border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.sec-head h2{font-size:17px;font-weight:700;letter-spacing:.08em}
.sec-head .n{margin-left:auto;font-size:13px;color:var(--txt-2);font-variant-numeric:tabular-nums}
.sec-sub{display:flex;align-items:center;font-size:13px;color:var(--txt-2);margin:2px 0 8px}
.sec-sub .lnk{flex:none}

.group{scroll-margin-top:calc(var(--sh,150px) + 8px);margin-bottom:8px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(26,32,48,.55);overflow:hidden}
.g-head{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;text-align:left;min-height:50px}
.g-icon{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:16px;font-weight:700;color:var(--gold-2);
  background:radial-gradient(circle at 32% 28%,#2E3A54,#1A2030 70%);border:1px solid var(--line)}
.g-head b{font-size:16px;letter-spacing:.06em;font-weight:700;min-width:0}
.g-head .n{margin-left:auto;font-size:13px;color:var(--txt-2);font-variant-numeric:tabular-nums}
.g-head .chev{flex:none;width:16px;text-align:center;color:var(--gold);font-size:18px;transition:transform .18s}
.group.open>.g-head .chev{transform:rotate(90deg)}
.g-body{display:none;padding:0 0 4px}
.group.open>.g-body{display:block}

/* 列表行 */
.row{position:relative;display:grid;grid-template-columns:24px 5.4em minmax(0,1fr) 36px;column-gap:8px;align-items:center;
  padding:7px 4px 7px 14px;border-top:1px solid rgba(255,255,255,.06)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qc)}
.row.y::before{background:linear-gradient(180deg,#F0D28A,#C99B3F)}
.qb{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;
  color:var(--qc);border:1px solid var(--qc);background:rgba(255,255,255,.03)}
.row .nm{font-size:15px;font-weight:700;letter-spacing:.02em;line-height:1.3;word-break:break-all}
.row .fx{font-size:13px;color:var(--txt-3);line-height:1.5}
.fx b{color:var(--gold-2);font-weight:600;font-variant-numeric:tabular-nums}
.fx i{font-style:normal;color:var(--gold)}
.fx .cl{display:inline-block}
.star{width:36px;height:36px;border:0;background:none;font-size:20px;color:var(--txt-2);display:grid;place-items:center;border-radius:8px}
.star.on{color:var(--gold-2)}
.cnote{grid-column:1/-1;display:none;margin:6px 8px 4px 0;padding:7px 9px;border-radius:7px;font-size:13px;line-height:1.5;color:var(--txt-3);
  background:rgba(217,180,91,.08);border:1px dashed rgba(217,180,91,.35)}
.open-note>.cnote{display:block}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;margin-left:4px;border-radius:99px;font-size:12px;vertical-align:1px;
  color:var(--gold-2);border:1px solid rgba(217,180,91,.5);background:rgba(217,180,91,.1);font-weight:600;line-height:1}

/* 卡片视图 */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 8px}
.cards.one{grid-template-columns:1fr}
.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid rgba(255,255,255,.06);
  border-radius:10px;padding:9px 6px 9px 13px;position:relative;overflow:hidden;min-width:0}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qc)}
.card.y::before{background:linear-gradient(180deg,#F0D28A,#C99B3F)}
.card .q{font-size:12px;letter-spacing:.2em;color:var(--qc);padding-right:30px}
.card .nm{font-size:15px;font-weight:700;margin-top:1px;padding-right:30px}
.card .fx{margin-top:4px;font-size:14px;color:var(--txt-3);padding-right:6px}
.card .fx .cl{display:block}
.card .star{position:absolute;right:0;top:0;width:36px;height:36px}
.card .cnote{margin:8px 6px 0 0}
.card.open-note .cnote{display:block}
mark{background:rgba(217,180,91,.28);color:#fff;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:56px 0;color:var(--txt-2)}
.empty b{display:block;font-size:16px;color:var(--txt);margin-bottom:6px}

/* ── 脚注 ── */
.notes{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.notes h3{font-size:14px;color:var(--gold);margin-bottom:6px;letter-spacing:.2em}
.notes p{font-size:13px;color:var(--txt-2);margin-bottom:6px;line-height:1.65}

/* ── 底部 tab bar ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:rgba(13,16,25,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b)}
.tabbar .in{width:100%;max-width:520px;display:flex}
.tabbar button{flex:1;background:none;border:0;color:var(--txt-2);font-size:12px;padding:7px 0 8px}
.tabbar button i{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 2px;border-radius:8px;
  font-style:normal;font-size:14px;font-weight:700;background:rgba(255,255,255,.05)}
.tabbar button.on{color:var(--gold-2)}
.tabbar button.on i{background:linear-gradient(180deg,rgba(217,180,91,.28),rgba(217,180,91,.12));box-shadow:inset 0 0 0 1px rgba(217,180,91,.4)}
.totop{position:fixed;right:14px;bottom:calc(84px + var(--safe-b));z-index:25;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:rgba(26,32,48,.92);color:var(--gold-2);font-size:18px;display:none}
.totop.show{display:block}
</style>
</head>

// 渲染一段文本：搜索命中高亮 / 数值加粗 / 【形态】着色
function render(text, ts){
  const n=text.length, f=new Array(n).fill(0); let m;
  const reNum=/[+＋-][0-9.]+%/g, reTag=/【[^】]+】/g;
  while((m=reNum.exec(text))) for(let i=m.index;i<m.index+m[0].length;i++) f[i]|=2;
  while((m=reTag.exec(text))) for(let i=m.index;i<m.index+m[0].length;i++) f[i]|=4;
  const low=text.toLowerCase();
  ts.forEach(t=>{ let p=0; while((p=low.indexOf(t,p))>-1){ for(let i=p;i<p+t.length;i++) f[i]|=1; p+=t.length; } });
  let out='',i=0;
  while(i<n){ let j=i; while(j<n&&f[j]===f[i]) j++;
    let s=esc(text.slice(i,j));
    if(f[i]&1) s='<mark>'+s+'</mark>';
    if(f[i]&2) s='<b>'+s+'</b>'; else if(f[i]&4) s='<i>'+s+'</i>';
    out+=s; i=j; }
  return out;
}

const fxHTML = (eff,ts) => { const ps=eff.split('，'); return ps.map((p,i)=>`<span class="cl">${render(p+(i<ps.length-1?'，':''),ts)}</span>`).join(''); };

const terms = () => state.q.trim().toLowerCase().split(/\s+/).filter(Boolean).concat(state.tag?[state.tag.toLowerCase()]:[]);
const hit = (e,ts) => { if(!ts.length) return true; const h=(e.name+' '+e.effect).toLowerCase(); return ts.every(t=>h.includes(t)); };
const keep = (e,ts) => (!state.quality||e.quality===state.quality) && (!state.favOnly||state.fav.has(e.name)) && hit(e,ts);
const isFilter = () => terms().length>0 || !!state.quality || state.favOnly;

function entryHTML(e,ts){
  const nm=render(e.name,ts), note=e.note?`<span class="badge" role="button" aria-label="数据说明${e.note}" data-note="${e.note}">${e.note}</span>`:'';
  const on=state.fav.has(e.name);
  const star=`<button class="star${on?' on':''}" type="button" data-fav="${esc(e.name)}" aria-label="${on?'取消收藏':'收藏'}">${on?'★':'☆'}</button>`;
  const cn=e.note?`<div class="cnote"><b>${e.note}</b> ${esc(NOTE[e.note]||'')}</div>`:'';
  const y=e.quality==='优品'?' y':'';
  if(state.view==='card')
    return `<div class="card${y}" style="--qc:${QCOL[e.quality]}"><div class="q">${e.quality}</div><div class="nm">${nm}${note}</div><div class="fx">${fxHTML(e.effect,ts)}</div>${star}${cn}</div>`;
  return `<div class="row${y}" style="--qc:${QCOL[e.quality]}"><span class="qb">${e.quality[0]}</span><div class="nm">${nm}${note}</div><div class="fx">${fxHTML(e.effect,ts)}</div>${star}${cn}</div>`;
}

function build(){
  const ts=terms(), filt=isFilter();
  const secs=D.sections.map((s,si)=>({s,si})).filter(x=>filt||x.si===state.tab);
  let html='', total=0;
  secs.forEach(({s,si})=>{
    let body='', cnt=0;
    s.groups.forEach(g=>{
      const es=g.entries.filter(e=>keep(e,ts)); if(!es.length) return;
      cnt+=es.length;
      const key=si+'|'+gShort(g.name), open=filt||state.open.has(key);
      const cls = state.view==='card' ? 'cards'+((s.id==='dual'||s.id==='special')?' one':'') : '';
      body+=`<section class="group${open?' open':''}" data-k="${esc(key)}">
        <button class="g-head" type="button" aria-expanded="${open}"><span class="g-icon">${esc(gIcon(g.name))}</span><b>${esc(gShort(g.name))}</b><span class="n">${es.length} 条</span><span class="chev">›</span></button>
        <div class="g-body">${cls?`<div class="${cls}">`:''}${es.map(e=>entryHTML(e,ts)).join('')}${cls?'</div>':''}</div></section>`;
    });
    if(!cnt) return; total+=cnt;
    const allOpen = s.groups.every(g=>state.open.has(si+'|'+gShort(g.name)));
    html+=`<section class="sec"><div class="sec-head"><span class="no">${s.no}</span><h2>${s.title}</h2><span class="n">${cnt} 条</span></div>`+
      (filt?'':`<div class="sec-sub"><span>${s.subtitle}</span><button class="lnk" type="button" data-act="toggleAll">${allOpen?'全部折叠':'全部展开'}</button></div>`)+
      body+`</section>`;
  });
  if(!html) html = state.favOnly && !terms().length && !state.quality
    ? `<div class="empty"><b>还没有收藏</b>点词条右侧的 ☆ 就能收藏，方便配装时对比</div>`
    : `<div class="empty"><b>没有找到相关词条</b>换个关键词，或清除筛选</div>`;
  $('main').innerHTML=html;
  $('tip').innerHTML = filt ? `<span>共 <b>${total}</b> 条${state.favOnly?' · 收藏':''}${terms().length||state.quality?' · 跨全部分类':''}</span><button class="lnk" type="button" data-act="clear">清除筛选</button>` : '';
}

function buildControls(){
  const ts=terms();
  // 属性标签：计数只受搜索词和收藏限制，且始终统计全部分类
  const baseTs=state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const all=[]; D.sections.forEach(s=>s.groups.forEach(g=>g.entries.forEach(e=>{ if((!state.favOnly||state.fav.has(e.name))&&(!state.quality||e.quality===state.quality)&&hit(e,baseTs)) all.push(e); })));
  $('tags').innerHTML = TAGS.map(t=>({t,c:all.filter(e=>(e.name+e.effect).includes(t)).length}))
    .filter(x=>x.c>0||x.t===state.tag)
    .map(x=>`<button class="chip${state.tag===x.t?' on':''}" type="button" data-tag="${x.t}">${x.t}<span class="c">${x.c}</span></button>`).join('');
  const pool=[]; D.sections.forEach(s=>s.groups.forEach(g=>g.entries.forEach(e=>{ if((!state.favOnly||state.fav.has(e.name))&&hit(e,ts)) pool.push(e); })));
  $('qchips').innerHTML = `<button class="chip${state.quality===''?' on':''}" type="button" data-q="">全部<span class="c">${pool.length}</span></button>`+
    QUALS.map(q=>`<button class="chip q-${QCLS[q]}${state.quality===q?' on':''}" type="button" data-q="${q}">${q}<span class="c">${pool.filter(e=>e.quality===q).length}</span></button>`).join('');
  $('panel').classList.toggle('show',state.panel);
  $('bFilter').classList.toggle('on',state.panel||!!state.quality);
  $('cFilter').classList.toggle('show',!!state.quality);
  $('bFav').classList.toggle('on',state.favOnly);
  const fc=$('cFav'); fc.textContent=state.fav.size; fc.classList.toggle('show',state.fav.size>0);
  $('bView').innerHTML = state.view==='list'
    ? '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
  $('bView').setAttribute('aria-label', state.view==='list'?'切换为卡片视图':'切换为列表视图');
  $('tabbar').innerHTML = D.sections.map((s,i)=>`<button type="button" class="${i===state.tab&&!isFilter()?'on':''}" data-t="${i}"><i>${TAB[i][0]}</i>${TAB[i][1]}</button>`).join('');
}
function buildGChips(){
  const gs=[...document.querySelectorAll('#main .group')], box=$('gchips');
  box.innerHTML = gs.map(g=>`<button class="chip" type="button" data-k="${esc(g.dataset.k)}">${esc(g.querySelector('.g-head b').textContent)}</button>`).join('');
  box.style.display = gs.length?'':'none';
  curKey=''; spy();
}
const refresh = () => { buildControls(); build(); buildGChips(); updateSH(); };
const saveFav = () => store.set('ht-fav',[...state.fav]);

// 头部与脚注
$('title').textContent = D.meta.title;
$('ver').textContent = `资源版本 ${D.meta.version} · ${D.meta.total} 条完整收录`+(D.meta.updated_names?` · 本版更新 ${D.meta.updated_names} 个名称`:'');
$('stats').innerHTML =
  `<div class="stat t"><b>${D.meta.total}</b><span>全部</span></div>`+
  QUALS.map(q=>`<div class="stat ${QCLS[q]}"><b>${D.meta.counts[q]}</b><span>${q[0]}</span></div>`).join('');
$('notes').innerHTML = '<h3>说明</h3>'+D.meta.notes.map(n=>`<p>${esc(n)}</p>`).join('');

// 事件
let tmr;
$('q').addEventListener('input',e=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ state.q=e.target.value; $('searchBox').classList.toggle('has',!!state.q); refresh(); },120); });
$('clr').onclick=()=>{ $('q').value=''; state.q=''; $('searchBox').classList.remove('has'); refresh(); $('q').focus(); };
$('bFilter').onclick=()=>{ state.panel=!state.panel; buildControls(); };
$('bView').onclick=()=>{ state.view=state.view==='list'?'card':'list'; store.set('ht-view',state.view); refresh(); };
$('bFav').onclick=()=>{ state.favOnly=!state.favOnly; refresh(); };
$('tags').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; state.tag=state.tag===b.dataset.tag?'':b.dataset.tag; refresh(); };
$('qchips').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; state.quality=b.dataset.q; refresh(); };
function clearAll(){ state.q='';state.tag='';state.quality='';state.favOnly=false; $('q').value=''; $('searchBox').classList.remove('has'); }
$('tip').onclick=e=>{ if(e.target.closest('[data-act=clear]')){ clearAll(); refresh(); } };
$('tabbar').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
  clearAll(); state.tab=+b.dataset.t; state.panel=false; refresh(); scrollTo(0,0); };
$('main').onclick=e=>{
  const st=e.target.closest('.star');
  if(st){ const n=st.dataset.fav; state.fav.has(n)?state.fav.delete(n):state.fav.add(n); saveFav();
    if(state.favOnly){ refresh(); } else { // 不重绘，避免列表跳动
      const on=state.fav.has(n); st.classList.toggle('on',on); st.textContent=on?'★':'☆'; buildControls(); }
    return; }
  const bd=e.target.closest('.badge'); if(bd){ bd.closest('.row,.card').classList.toggle('open-note'); return; }
  const ta=e.target.closest('[data-act=toggleAll]');
  if(ta){ const s=D.sections[state.tab], keys=s.groups.map(g=>state.tab+'|'+gShort(g.name));
    const allOpen=keys.every(k=>state.open.has(k)); keys.forEach(k=>allOpen?state.open.delete(k):state.open.add(k)); build(); return; }
  const gh=e.target.closest('.g-head');
  if(gh && !isFilter()){ const g=gh.parentElement, k=g.dataset.k; const o=!g.classList.contains('open');
    o?state.open.add(k):state.open.delete(k); g.classList.toggle('open',o); gh.setAttribute('aria-expanded',o);
    const sec=g.closest('.sec'), tb=sec.querySelector('[data-act=toggleAll]');
    if(tb) tb.textContent=D.sections[state.tab].groups.every(x=>state.open.has(state.tab+'|'+gShort(x.name)))?'全部折叠':'全部展开'; }
};

// 吸顶栏始终固定；量出它的高度，让跳转后的分组不被遮住
const tt=$('totop'), sticky=$('sticky'); let curKey='', ticking=false;
function updateSH(){ document.documentElement.style.setProperty('--sh', sticky.offsetHeight+'px'); }
if(window.ResizeObserver) new ResizeObserver(updateSH).observe(sticky); else addEventListener('resize',updateSH);
// 滚动时高亮当前所在分组对应的快捷按钮
function spy(){
  const line=sticky.offsetHeight+16; let cur=null;
  for(const g of document.querySelectorAll('#main .group')){ if(g.getBoundingClientRect().top<=line) cur=g; else break; }
  const k=cur?cur.dataset.k:''; if(k===curKey) return; curKey=k;
  const box=$('gchips'); let on=null;
  box.querySelectorAll('.chip').forEach(c=>{ const m=c.dataset.k===k; c.classList.toggle('on',m); if(m) on=c; });
  if(on) box.scrollLeft = on.offsetLeft - box.clientWidth/2 + on.offsetWidth/2;
}
addEventListener('scroll',()=>{
  tt.classList.toggle('show',scrollY>600);
  if(!ticking){ ticking=true; requestAnimationFrame(()=>{ ticking=false; spy(); }); }
},{passive:true});
$('gchips').onclick=e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  const g=[...document.querySelectorAll('#main .group')].find(x=>x.dataset.k===b.dataset.k); if(!g) return;
  if(!g.classList.contains('open')){ g.classList.add('open'); g.querySelector('.g-head').setAttribute('aria-expanded',true); state.open.add(g.dataset.k); }
  g.scrollIntoView({behavior:'smooth',block:'start'});
};
tt.onclick=()=>scrollTo({top:0,behavior:'smooth'});

refresh();
</script>
</body>
</html>
